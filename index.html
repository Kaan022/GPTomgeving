<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f33"><title>NextMatch Manager OS</title><style>:root{--nav:#0b1f33;--nav2:#143755;--bg:#e9eff4;--p:#fff;--line:#cfd9e2;--ink:#102333;--mut:#627586;--teal:#007f89;--blue:#2366d1;--amber:#db8b00;--red:#c43d4b;--green:#16885d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Arial,sans-serif}button,textarea,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.side{background:linear-gradient(180deg,var(--nav),#071625);color:#d7e4ee;padding:20px 14px;position:fixed;inset:0 auto 0 0;width:232px}.brand{font-size:20px;font-weight:900;padding:2px 10px 25px}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;background:#e7f8f8;color:var(--teal);border-radius:8px;margin-right:8px;font-style:normal}.side small{display:block;color:#7f9aaf;padding:8px 12px;text-transform:uppercase;font-size:9px;letter-spacing:.13em}.side button{width:100%;border:0;background:transparent;color:#b8cbd9;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;margin:2px 0;font-weight:700}.side button.on,.side button:hover{background:#1a4568;color:#fff}.main{grid-column:2}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.top b{font-size:16px}.top span{color:var(--mut)}.content{padding:22px;max-width:1500px;margin:auto}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.55fr .75fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.panel{background:var(--p);border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 18px #17324a12;overflow:hidden}.ph{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#f8fafb}.ph b{font-size:12px;text-transform:uppercase;letter-spacing:.05em}.pb{padding:15px}.metric b{font-size:27px;display:block;margin-top:8px}.metric small,.mut{color:var(--mut)}.tag{display:inline-block;padding:4px 7px;border-radius:4px;background:#e6eef5;color:#37536a;font-size:10px;font-weight:800}.green{background:#def3e9;color:var(--green)}.amber{background:#fff0ce;color:#9b6200}.red{background:#fde6ea;color:var(--red)}.blue{background:#e5eefc;color:var(--blue)}h1{font-size:28px;margin:0 0 5px}h2{font-size:20px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}.hero{background:linear-gradient(125deg,#0e3555,#176a75);color:#fff;padding:20px;border-radius:10px}.hero p{color:#cee1e7;line-height:1.55}.btn{border:1px solid #b8c7d2;background:#fff;color:var(--ink);border-radius:7px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.dark{background:var(--nav);color:#fff}.btn.block{width:100%}.row{display:grid;grid-template-columns:50px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #e2e8ed}.row:last-child{border:0}.row strong{color:var(--teal)}.row p{margin:4px 0 0;color:var(--mut);font-size:12px}.pitch{height:310px;background:repeating-linear-gradient(90deg,#3c8b60 0,#3c8b60 12.5%,#438f65 12.5%,#438f65 25%);position:relative;border-radius:7px;border:3px solid #fff;box-shadow:0 0 0 1px #2d704e}.pitch:after{content:"";position:absolute;inset:8px;border:1px solid #ffffffa8;background:linear-gradient(90deg,transparent 49.8%,#ffffffaa 50%,transparent 50.2%)}.pl{position:absolute;z-index:2;width:29px;height:29px;border-radius:50%;background:#ffe47a;border:2px solid #0b1f33;display:grid;place-items:center;font-size:10px;font-weight:900;transform:translate(-50%,-50%)}.brief{border-left:4px solid var(--teal);background:#ecf7f7;padding:12px;line-height:1.5}.inbox{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.ico{width:32px;height:32px;background:#e6eef5;border-radius:7px;display:grid;place-items:center}.tabs{display:flex;gap:5px;margin-bottom:14px;overflow:auto}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:7px;font-weight:800;white-space:nowrap}.tabs button.on{background:var(--nav);color:#fff}.voice{padding:20px;text-align:center;border:1px dashed #9fb2c0;border-radius:9px;background:#f7fafb}.mic{width:72px;height:72px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:27px;cursor:pointer}.mic.live{animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 14px #c43d4b22}}textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);background:#fff}.exercise{border-left:4px solid var(--blue);padding:12px;margin:8px 0;background:#f6f9fc;border-radius:5px}.exercise b{display:block}.exercise span{color:var(--mut);font-size:12px}.video{background:#07131d;color:#dceaf2;min-height:310px;display:grid;place-items:center;border-radius:8px;position:relative}.radar{height:220px;background:#287348;position:relative;border:2px solid #fff;border-radius:5px}.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff}.dot.opp{background:#ef6c77}.timeline{height:14px;background:#dfe7ed;border-radius:10px;position:relative}.event{position:absolute;width:9px;height:22px;top:-4px;background:var(--amber);border-radius:4px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e1e7ec;font-size:12px}th{color:var(--mut);font-size:10px;text-transform:uppercase}.mobile{display:none}@media(max-width:900px){.app{display:block}.side{display:none}.main{grid-column:auto}.g2,.g3,.g4{grid-template-columns:1fr}.content{padding:14px 14px 78px}.mobile{display:grid;position:fixed;left:8px;right:8px;bottom:8px;grid-template-columns:repeat(5,1fr);background:var(--nav);padding:6px;border-radius:10px;z-index:9}.mobile button{border:0;background:transparent;color:#afc3d1;padding:9px 2px;font-size:10px}.mobile button.on{color:#fff;background:var(--nav2);border-radius:6px}.top{padding:0 14px}}</style></head><body><div id="app"></div><script>const D={view:location.hash.slice(1)||'desk',license:'VC3',transcript:'We kregen goed druk op hun opbouw zodra de bal naar de back ging. Onze 9 stuurde goed naar rechts en de 10 schermde de 6 af. Na onze eigen aanval stonden de 6 en 8 soms te hoog, waardoor de restverdediging niet meer 3 plus 2 was. De verre buitenspeler reageerde te laat op de omschakeling.'};const nav=[['desk','Manager’s Desk'],['debrief','Wedstrijddebrief'],['training','Training Centre'],['tactics','Tactics Board'],['video','Video Lab'],['portfolio','VC Portfolio']];function go(v){D.view=v;location.hash=v;render()}function status(t,c='blue'){return `<span class="tag ${c}">${t}</span>`}function panel(t,b,r=''){return `<section class="panel"><div class="ph"><b>${t}</b>${r}</div><div class="pb">${b}</div></section>`}function shell(body){return `<div class="app"><aside class="side"><div class="brand"><i>NM</i>NextMatch</div><small>Club operations</small>${nav.map(n=>`<button class="${D.view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<small>Team</small><button>Wilhelmus O17-2</button><button>Seizoen 2026/27</button></aside><main class="main"><header class="top"><div><b>NextMatch Manager OS</b> <span>· Wilhelmus O17-2 · 5e divisie</span></div>${status('VC3 development','green')}</header><div class="content">${body}</div></main><nav class="mobile">${nav.slice(0,5).map(n=>`<button class="${D.view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1].split(' ')[0]}</button>`).join('')}</nav></div>`}function metric(a,b,c=''){return `<div class="panel metric"><div class="pb"><small>${a}</small><b>${b}</b><span class="mut">${c}</span></div></div>`}function players(){let p=[[50,91,1],[20,70,5],[43,70,4],[70,70,3],[31,51,6],[55,51,8],[9,24,11],[31,25,10],[54,25,7],[80,24,2],[50,9,9]];return p.map(x=>`<div class="pl" style="left:${x[0]}%;top:${x[1]}%">${x[2]}</div>`).join('')}function desk(){return shell(`<div class="hero"><span class="tag green">ZATERDAG · 12:30</span><h1>Forum Sport O17-1</h1><p>Belangrijkste managementvraag: hoe houden we vijf spelers hoog zonder dat onze 3+2-restverdediging uiteenvalt?</p><button class="btn primary" onclick="go('debrief')">Start wedstrijddebrief</button></div><div class="grid g4" style="margin:14px 0">${metric('Plan readiness','82%','2 open punten')}${metric('VC-bewijs','3/5','PVB’s gedekt')}${metric('Coach load','160 min','maandag + donderdag')}${metric('Video confidence','74%','demoanalyse')}</div><div class="grid g2"><div class="grid">${panel('Manager inbox',`<div class="inbox"><div class="ico">!</div><div><b>Restverdediging onvoldoende geborgd</b><p class="mut">Tweemaal vrije tegenaanval door het centrum. Zet dit als hoofdthema maandag.</p></div></div><div class="inbox"><div class="ico">▶</div><div><b>Vier clips klaar voor review</b><p class="mut">Hoge verovering, mislukte tegenpressing en twee druktriggers.</p></div></div><div class="inbox"><div class="ico">VC</div><div><b>PVB 3-bewijs ontbreekt</b><p class="mut">Leg stafrollen en wedstrijdbespreking vast.</p></div></div>`)}${panel('Week cycle',`<div class="row"><strong>MA</strong><div><b>Herstellen van de 3+2</b><p>Herkennen → uitvoeren onder weerstand</p></div>${status('80 min','blue')}</div><div class="row"><strong>DO</strong><div><b>Druk zetten op korte opbouw</b><p>9 stuurt, 10 schermt, verre kant half-half</p></div>${status('80 min','blue')}</div><div class="row"><strong>ZA</strong><div><b>Presteren tegen Forum Sport</b><p>Eerste 15 minuten: compact, richting en discipline</p></div>${status('12:30','amber')}</div>`)}</div><div class="grid">${panel('Speelwijze · in balbezit',`<div class="pitch">${players()}</div><p class="mut">1-3-2-5: linksback wordt linker CV, rechtsback hoog, 6 en 8 onder de bal.</p>`,status('1-3-2-5','green'))}${panel('Coach AI-briefing',`<div class="brief"><b>Niet méér trainen. Beter verbinden.</b><br>Maandag moet de aanval altijd eindigen met een echte tegencounter. Donderdag pas je dezelfde 3+2 toe in de 11v11. Zo ontstaat transfer naar zaterdag.</div>`)}</div></div>`)}function debrief(){return shell(`<div class="grid g2"><div class="grid">${panel('Praat je wedstrijd uit',`<div class="voice"><button id="mic" class="mic" onclick="listen()">●</button><h2>Druk om in te spreken</h2><p class="mut">Vertel: wat gebeurde, waarom, en welk gedrag wil je terugzien?</p></div><div style="height:10px"></div><textarea id="tr" oninput="D.transcript=this.value">${D.transcript}</textarea><div style="margin-top:10px"><button class="btn primary" onclick="analyse()">Analyseer debrief</button> <button class="btn" onclick="speak()">Lees terug</button></div>`)}${panel('Van observatie naar coachactie',`<table><tr><th>Feit</th><th>Interpretatie</th><th>Interventie</th></tr><tr><td>Druktrigger naar back werkte</td><td>9 en 10 waren onderling afgestemd</td><td>Donderdag consolideren in 11v11</td></tr><tr><td>6 en 8 tegelijk boven de bal</td><td>Geen eigenaar van centrumcontrole</td><td>Maandag: stopmoment en keuzevraag</td></tr><tr><td>Verre buitenspeler te laat</td><td>Half-half startpositie niet herkend</td><td>Visuele cue + punt voor juiste kanteling</td></tr></table>`,status('Coachbaar','green'))}</div><div class="grid">${panel('KNVB-logica',`<div class="brief"><b>Wedstrijd → analyse → doel → training → wedstrijd.</b><br>De tool vraagt niet alleen wat fout ging, maar legt teamtaak, voetbalhandeling, onderlinge afstemming en coachgedrag vast.</div>`)}${panel('Hoofdthema',`<h2>Restverdediging 3+2</h2><p class="mut">Aanvallen met vijf, maar centrum en diepte blijven gecontroleerd.</p>${status('PVB 1 · wedstrijd','blue')} ${status('PVB 2 · training','blue')} ${status('PVB 5 · periodiseren','amber')}`)}</div></div>`)}function training(){let ex=(n,t,m,d)=>`<div class="exercise"><b>${n}. ${t} · ${m}'</b><span>${d}</span></div>`;return shell(`<div class="tabs"><button class="on">Week 32</button><button>Maandag</button><button>Donderdag</button><button>Wedstrijd</button></div><div class="grid g2"><div class="grid">${panel('Maandag · hoofdthema',`${ex(1,'Activeren en scannen',10,'Open draaien en direct herstellen onder de bal.')}${ex(2,'6v4 + drie restverdedigers',20,'Aanval mag pas door wanneer centrum en diepte gedekt zijn.')}${ex(3,'Aanvallen naar 3+2',25,'Iedere aanval eindigt met schot en directe tegencounter.')}${ex(4,'8v8 wedstrijdvorm',20,'Bonus voor herovering binnen zes seconden; anders compact terug.')}`,status('Herkennen → beheersen','blue'))}${panel('Donderdag · tegenhangend thema',`${ex(1,'Drukrichting zonder bal',10,'9 bepaalt kant; 10 schermt hun 6.')}${ex(2,'Opbouw onder hoge druk',20,'Eigen ploeg bewaakt 3+2 na iedere doorbraak.')}${ex(3,'11v11 wedstrijdscenario',35,'Start eerste 15 minuten en speel meerdere scorestanden.')}${ex(4,'Spelhervatting + restorganisatie',10,'Na elke variant staat minimaal 2+1 achter de bal.')}`,status('Transfer → presteren','green'))}</div><div class="grid">${panel('Periodiseringscheck',`<div class="row"><strong>1</strong><div><b>Voetbalprobleem zichtbaar</b><p>Vrije tegencounter door centrum</p></div>${status('ja','green')}</div><div class="row"><strong>2</strong><div><b>Representatieve weerstand</b><p>Richting, tijdsdruk en omschakeling</p></div>${status('ja','green')}</div><div class="row"><strong>3</strong><div><b>Coachgedrag gepland</b><p>Vraag → stop → herstart → laten oplossen</p></div>${status('ja','green')}</div><div class="row"><strong>4</strong><div><b>Evaluatiecriterium</b><p>Geen vrije eerste pass door centrum</p></div>${status('scherp','amber')}</div>`)}${panel('VC-bewijs automatisch',`<p><b>PVB 2:</b> trainingsvoorbereiding, organisatie, methodiek en reflectie.</p><p><b>PVB 5:</b> weekdoel verbonden aan speelwijze en wedstrijdontwikkeling.</p><button class="btn block" onclick="go('portfolio')">Open portfolio</button>`)}</div></div>`)}function tactics(){return shell(`<div class="grid g2"><div>${panel('Tactics Board · sleepbaar in volledige versie',`<div class="pitch">${players()}</div><div style="margin-top:10px"><button class="btn dark">In balbezit 1-3-2-5</button> <button class="btn">Zonder bal 4-1-2-1-2</button></div>`)}</div><div class="grid">${panel('Teamtaken',`<div class="row"><strong>9</strong><div><b>Stuur naar één kant</b><p>Looplijn sluit centrum en dwingt pass naar back.</p></div></div><div class="row"><strong>10</strong><div><b>Scherm hun 6</b><p>Niet blind doorjagen; eerst centrale oplossing blokkeren.</p></div></div><div class="row"><strong>BU</strong><div><b>Verre buitenspeler half-half</b><p>Kantelen zonder de verre back volledig los te laten.</p></div></div><div class="row"><strong>6/8</strong><div><b>Onder de bal</b><p>Minimaal één bewaakt centrum, één kan aansluiten.</p></div></div>`)}${panel('Observeerbare indicatoren',`<p>• eerste pass na balverlies door centrum</p><p>• afstand tussen laatste lijn en middenveld</p><p>• tijd tot gezamenlijke kanteling</p><p>• bezetting van vijf aanvalsstroken</p>`)}</div></div>`)}function video(){return shell(`<div class="grid g2"><div class="grid">${panel('Video Lab',`<div class="video"><div><h2>Veo-like analyseomgeving</h2><p>Upload in productie een tactische cameravideo.</p><button class="btn primary" onclick="demoVideo()">Draai demoanalyse</button></div></div><div style="margin-top:14px" class="timeline"><i class="event" style="left:14%"></i><i class="event" style="left:38%"></i><i class="event" style="left:57%"></i><i class="event" style="left:81%"></i></div><p class="mut">12:44 hoge verovering · 28:10 vrije tegencounter · 44:02 druktrigger · 67:31 aanval vijf banen</p>`,status('Demo · geen echte inferentie','amber'))}${panel('Event review',`<table><tr><th>Moment</th><th>Detectie</th><th>Confidence</th><th>Coachbetekenis</th></tr><tr><td>12:44</td><td>Hoge verovering</td><td>91%</td><td>Drukrichting werkte</td></tr><tr><td>28:10</td><td>Restdefence broken</td><td>78%</td><td>6 en 8 boven de bal</td></tr><tr><td>44:02</td><td>Back press trigger</td><td>86%</td><td>9/10 goed afgestemd</td></tr></table>`)}</div><div class="grid">${panel('2D radar',`<div class="radar">${Array.from({length:20},(_,i)=>`<i class="dot ${i>9?'opp':''}" style="left:${8+(i%10)*9}%;top:${20+Math.floor(i/10)*55+(i%3)*5}%"></i>`).join('')}</div>`)}${panel('Neural pipeline',`<div class="row"><strong>1</strong><div><b>RT-DETRv2</b><p>spelers, officials, bal en doelen</p></div></div><div class="row"><strong>2</strong><div><b>ByteTrack + DINOv2</b><p>tracking en re-identification</p></div></div><div class="row"><strong>3</strong><div><b>Field calibration</b><p>beeld naar 2D-veldcoördinaten</p></div></div><div class="row"><strong>4</strong><div><b>VideoMAE + temporal/GNN</b><p>acties, relaties en tactische patronen</p></div></div><div class="row"><strong>5</strong><div><b>Coach knowledge graph</b><p>clip → principe → training → VC-bewijs</p></div></div>`,status('Architectuur gereed','green'))}</div></div>`)}function portfolio(){let vc3=[['PVB 1','Coachen wedstrijden','Wedstrijdplan, clips, nabespreking','In review'],['PVB 2','Geven van trainingen','Maandag- en donderdagplan','Gereed'],['PVB 3','Aansturen begeleidingsteam','Stafrollen en briefing','Ontbreekt'],['PVB 4','Herkennen talent','Contextuele observaties','Ontbreekt'],['PVB 5','Periodiseren speelwijze','Weekcyclus en ontwikkellijn','Concept']];return shell(`<div class="hero"><span class="tag green">OPLEIDINGSDOSSIER</span><h1>VC3 Portfolio Cockpit</h1><p>Bewijs wordt tijdens normaal coachwerk opgebouwd; geen map achteraf vullen.</p></div><div style="height:14px"></div>${panel('PVB evidence matrix',`<table><tr><th>Onderdeel</th><th>Kerntaak</th><th>Automatisch bewijs</th><th>Status</th></tr>${vc3.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${status(r[3],r[3]=='Gereed'?'green':r[3]=='Ontbreekt'?'red':'amber')}</td></tr>`).join('')}</table>`,status('3 van 5 geraakt','amber'))}`)}function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Gebruik Chrome/Edge of typ de debrief.');let r=new SR;r.lang='nl-NL';r.continuous=true;let m=document.getElementById('mic');m.classList.add('live');r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';D.transcript=(D.transcript+' '+s).trim();document.getElementById('tr').value=D.transcript};r.onend=()=>m.classList.remove('live');r.start()}function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(D.transcript);u.lang='nl-NL';speechSynthesis.speak(u)}function analyse(){D.transcript=document.getElementById('tr').value;alert('Debrief omgezet naar feiten, interpretaties en coachinterventies. In productie gaat dit via gestructureerde AI-output en validatoren.')}function demoVideo(){alert('Demo geladen. Echte video-inferentie vraagt een GPU-service, gelabelde voetbaldata en toestemming voor verwerking.')}function render(){let v={desk, debrief, training, tactics, video, portfolio}[D.view]||desk;document.getElementById('app').innerHTML=v()}addEventListener('hashchange',()=>{D.view=location.hash.slice(1)||'desk';render()});window.go=go;window.listen=listen;window.speak=speak;window.analyse=analyse;window.demoVideo=demoVideo;render();</script></body></html>
