name: Deploy private NextMatch Coach OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application scripts
        run: |
          node --check assets/language-core.js
          node --check assets/localized-pdf.js
          node --check assets/release-v9.js
          node --check assets/wilhelmus-demo.js
      - name: Build private coach app
        run: |
          mkdir -p _site/supabase
          cp index.html _site/index.html
          cp -r assets _site/assets
          cp supabase/schema.sql _site/supabase/schema.sql
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
