name: Deploy private NextMatch Coach OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application scripts
        run: |
          node --check assets/auth-ux.js
          node --check assets/app-polish.js
          node --check assets/language-core.js
          node --check assets/localized-pdf.js
          node --check assets/release-v9.js
          node --check assets/wilhelmus-demo.js
          node --check assets/product-v12.js
          node --check assets/pdf-v12.js
          node --check assets/platform-v13.js
          node --check assets/edge-pdf-v13.js
          node --check assets/drawing-v14.js
          node --check assets/pdf-v14.js
          node --check assets/mobile-v15.js
          node --check assets/periodisation-ai-v16.js
          node --check assets/periodisation-mobile-v16.js
          node --check service-worker.js
          node --check assets/boot.js
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Build private coach app
        run: |
          mkdir -p _site/supabase
          cp index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          cp service-worker.js _site/service-worker.js
          cp -r assets _site/assets
          cp supabase/schema.sql _site/supabase/schema.sql
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4